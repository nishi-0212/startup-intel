services:
  - type: web
    name: startup-intel-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false            # your Vercel URL, e.g. https://startup-intel.vercel.app
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REASONING
        value: low
      - key: TAVILY_DEPTH
        value: advanced
      - key: MAX_API_CALLS
        value: "80"
      - key: MAX_TOKENS
        value: "60000"
      - key: JOB_TIMEOUT
        value: "120"